name: Refresh listings

on:
  schedule:
    # Every day at 5:17am Arizona time (12:17 UTC). Arizona has no daylight saving.
    - cron: "17 12 * * *"
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh-listings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Refresh events.json
        run: python3 scripts/refresh_events.py
        env:
          # Settings > Secrets and variables > Actions. A missing one just skips that source.
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
          SUBMISSIONS_CSV_URL: ${{ secrets.SUBMISSIONS_CSV_URL }}

      - name: Commit if anything changed
        id: commit
        run: |
          if git diff --quiet --exit-code -- events.json && git ls-files --error-unmatch events.json >/dev/null 2>&1; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json
          git commit -m "Refresh listings $(TZ=America/Phoenix date +%F)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild the site
        # Pushes made by this workflow don't always trigger a Pages build, so ask for one.
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
