name: Refresh listings

on:
  schedule:
    # Arizona has no daylight saving, so these never drift.
    - cron: "17 12 * * *"   # 5:17 AM Arizona: new listings + tonight's and tomorrow's details
    - cron: "43 23 * * *"   # 4:43 PM Arizona: re-check tonight (sell-outs, cancellations, set times)
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab
    inputs:
      force:
        description: "Re-check every show tonight and tomorrow, even ones checked in the last few hours"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  # One run at a time: a run that starts while another is going waits its turn.
  group: refresh-listings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Refresh events.json
        run: python3 scripts/refresh_events.py
        env:
          # Settings > Secrets and variables > Actions. A missing one just skips that source.
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
          SUBMISSIONS_CSV_URL: ${{ secrets.SUBMISSIONS_CSV_URL }}

      - name: Fill in tonight's and tomorrow's show details
        # Reads each show's official event page (doors, show, price, ages, status,
        # lineup) into events.json. If it fails, the refreshed listings still ship.
        continue-on-error: true
        timeout-minutes: 15
        run: python3 scripts/enrich_events.py ${{ inputs.force && '--force' || '' }}

      - name: Suggest Can't-Miss candidates (Mondays)
        # Writes hot-candidates.json for the weekly editor review. Only hot.json
        # (editor-approved) is featured on the site. Skips itself except on
        # Mondays or when the last list is over a week old.
        continue-on-error: true
        timeout-minutes: 15
        run: python3 scripts/suggest_hot.py ${{ inputs.force && '--force' || '' }}

      - name: Commit if anything changed
        id: commit
        run: |
          if git diff --quiet --exit-code -- events.json hot-candidates.json && git ls-files --error-unmatch events.json >/dev/null 2>&1 \
             && { [ ! -f hot-candidates.json ] || git ls-files --error-unmatch hot-candidates.json >/dev/null 2>&1; }; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json
          [ -f hot-candidates.json ] && git add hot-candidates.json
          git commit -m "Refresh listings $(TZ=America/Phoenix date '+%F %H:%M')"
          # Another job (e.g. the weekly Scene Picks) may have pushed meanwhile.
          git push || { git pull --rebase && git push; }
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild the site
        # Pushes made by this workflow don't always trigger a Pages build, so ask for one.
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
